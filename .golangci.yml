# golangci-lint v2 configuration for olc-go.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - goprintffuncname
    - gosec
    - misspell
    - modernize
    - nakedret
    - nilerr
    - prealloc
    - predeclared
    - reassign
    - revive
    - unconvert
    - unparam
    - usetesting
  settings:
    errcheck:
      check-type-assertions: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    misspell:
      locale: US
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: git.quad4.io/libraries/olc-go
    goimports:
      local-prefixes:
        - git.quad4.io/libraries/olc-go

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
